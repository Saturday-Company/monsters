    <meta charset="UTF-8" />

    <meta name="theme-color" content="#0b0c12" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Monsters</title>
  </head>
